server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  application:
    name: maple-payments-hub
    
  profiles:
    active: dev
    
  datasource:
    url: jdbc:postgresql://localhost:5432/maple_payments
    username: maple_user
    password: maple_password
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MaplePaymentsHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true
    consumer:
      group-id: maple-payments-hub
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.maple.event,com.maple.dto
        
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MAPLE_JWT_ISSUER_URI:http://localhost:8080/auth/realms/maple}
          jwk-set-uri: ${MAPLE_JWT_JWK_SET_URI:http://localhost:8080/auth/realms/maple/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  health:
    db:
      enabled: true
    kafka:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.50, 0.90, 0.95, 0.99
        
logging:
  level:
    com.maple: INFO
    org.springframework.security: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

# Application specific configuration
maple:
  api:
    version: 1.0.0
    title: Maple Payments Hub API
    description: Corporate Payment Initiation and Processing System
    
  jwt:
    issuer-uri: ${MAPLE_JWT_ISSUER_URI:http://localhost:8080/auth/realms/maple}
    jwk-set-uri: ${MAPLE_JWT_JWK_SET_URI:http://localhost:8080/auth/realms/maple/protocol/openid-connect/certs}
    
  kafka:
    consumer:
      group-id: maple-payments-hub
      
  payment:
    approval-threshold-cents: ${MAPLE_PAYMENT_APPROVAL_THRESHOLD_CENTS:10000000}
    batch-size: ${MAPLE_PAYMENT_BATCH_SIZE:100}
    batch-schedule: ${MAPLE_PAYMENT_BATCH_SCHEDULE:0 */30 * * * *}
    max-daily-limit-cents: 1000000000
    batch-creator-user-id: ${MAPLE_BATCH_CREATOR_USER_ID:00000000-0000-0000-0000-000000000001}

  approval:
    default-holiday-calendar-id: ${MAPLE_APPROVAL_DEFAULT_HOLIDAY_CALENDAR_ID:a0000000-0000-4000-8000-000000000001}
    stuck-approval-hours: ${MAPLE_APPROVAL_STUCK_HOURS:24}
    repeat-escalation-hours: ${MAPLE_APPROVAL_REPEAT_ESCALATION_HOURS:24}
    escalation-scan-ms: ${MAPLE_APPROVAL_ESCALATION_SCAN_MS:300000}
    block-weekends: ${MAPLE_APPROVAL_BLOCK_WEEKENDS:true}
    
  sftp:
    host: ${MAPLE_SFTP_HOST:localhost}
    port: ${MAPLE_SFTP_PORT:2222}
    username: ${MAPLE_SFTP_USERNAME:sftp_user}
    password: ${MAPLE_SFTP_PASSWORD:sftp_password}
    remote-dir: ${MAPLE_SFTP_REMOTE_DIR:/uploads}
    connect-timeout: 30000
    session-timeout: 60000
    batch:
      enabled: ${MAPLE_SFTP_BATCH_ENABLED:true}
      receipts-subdir: ${MAPLE_SFTP_RECEIPTS_SUBDIR:receipts}
      receipt-suffix: ${MAPLE_SFTP_RECEIPT_SUFFIX:.rcpt}
      max-retries: ${MAPLE_SFTP_BATCH_MAX_RETRIES:5}
      retry-base-delay-ms: ${MAPLE_SFTP_BATCH_RETRY_BASE_MS:60000}
      retry-scan-ms: ${MAPLE_SFTP_BATCH_RETRY_SCAN_MS:120000}
      receipt-poll-ms: ${MAPLE_SFTP_RECEIPT_POLL_MS:180000}
      strict-host-key-checking: ${MAPLE_SFTP_STRICT_HOST_KEY:false}
      known-hosts-path: ${MAPLE_SFTP_KNOWN_HOSTS_PATH:}
      upload-immediate-attempts: ${MAPLE_SFTP_UPLOAD_ATTEMPTS:3}
      upload-immediate-backoff-ms: ${MAPLE_SFTP_UPLOAD_BACKOFF_MS:2000}
      receipt-preview-max-chars: ${MAPLE_SFTP_RECEIPT_PREVIEW_MAX:4000}
    
  hsm:
    mode: ${MAPLE_HSM_MODE:simulated}
    key-alias: ${MAPLE_HSM_KEY_ALIAS:maple-payment-signing-key}
    
  file-storage:
    type: ${MAPLE_FILE_STORAGE_TYPE:local}
    local-path: ${MAPLE_FILE_STORAGE_LOCAL_PATH:./data/files}
    s3-bucket: ${MAPLE_FILE_STORAGE_S3_BUCKET:maple-payments-files}
    
  webhook:
    secret: ${MAPLE_WEBHOOK_SECRET:change-this-in-production}
    signature-header: X-Maple-Signature
    
  security:
    sensitive-fields:
      - accountNumber
      - routingNumber
      - iban
      - pan
      - cvv
      - ssn
      - taxId
